<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zip Jeweler Dashboard — Michael Ray Jewelry</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modules.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="topbar" id="topbar">
        <div class="topbar__left">
            <button class="topbar__menu-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <div class="topbar__brand">
                <svg class="topbar__logo" width="32" height="32" viewBox="0 0 32 32">
                    <polygon points="16,2 28,10 24,28 8,28 4,10" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <polygon points="16,6 23,11 21,24 11,24 9,11" fill="currentColor" opacity="0.15"/>
                    <circle cx="16" cy="16" r="3" fill="currentColor" opacity="0.4"/>
                </svg>
                <span class="topbar__title">Zip Jeweler</span>
            </div>
        </div>
        <div class="topbar__center">
            <div class="search-bar">
                <svg class="search-bar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" class="search-bar__input" id="global-search" placeholder="Search inventory, orders, customers..." autocomplete="off">
                <kbd class="search-bar__shortcut">⌘K</kbd>
            </div>
        </div>
        <div class="topbar__right">
            <button class="topbar__action" id="btn-xml-import" aria-label="Import XML" title="Import XML Data">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </button>
            <button class="topbar__action" id="btn-xml-export" aria-label="Export XML" title="Export XML Data">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
            </button>
            <div class="topbar__divider"></div>
            <button class="topbar__action" id="btn-notifications" aria-label="Notifications" title="Notifications">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
                </svg>
                <span class="topbar__badge" id="notification-badge">3</span>
            </button>
            <button class="topbar__action" id="btn-tools-manager" aria-label="Tools Manager" title="Manage Tools & Plugins">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                </svg>
            </button>
            <div class="topbar__divider"></div>
            <div class="topbar__user" id="user-menu-trigger">
                <div class="topbar__avatar">MR</div>
                <span class="topbar__username">Michael Ray</span>
            </div>
        </div>
    </header>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar__nav">
            <ul class="sidebar__menu">
                <li class="sidebar__item sidebar__item--active" data-route="dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>Dashboard</span>
                </li>
                <li class="sidebar__item" data-route="inventory">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
                        <line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/>
                        <polyline points="2 15.5 12 8.5 22 15.5"/><line x1="12" y1="2" x2="12" y2="8.5"/>
                    </svg>
                    <span>Inventory</span>
                </li>
                <li class="sidebar__item" data-route="orders">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
                    </svg>
                    <span>Orders</span>
                    <span class="sidebar__badge">12</span>
                </li>
                <li class="sidebar__item" data-route="customers">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
                    </svg>
                    <span>Customers</span>
                </li>
                <li class="sidebar__separator"></li>
                <li class="sidebar__item" data-route="appraisals">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <span>Appraisals</span>
                </li>
                <li class="sidebar__item" data-route="repairs">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
                    </svg>
                    <span>Repairs</span>
                    <span class="sidebar__badge sidebar__badge--warning">5</span>
                </li>
                <li class="sidebar__item" data-route="custom-orders">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    <span>Custom Orders</span>
                </li>
                <li class="sidebar__separator"></li>
                <li class="sidebar__item" data-route="reports">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
                    </svg>
                    <span>Reports</span>
                </li>
                <li class="sidebar__item" data-route="tools">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>
                    </svg>
                    <span>Tools</span>
                </li>
                <li class="sidebar__item" data-route="settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                    </svg>
                    <span>Settings</span>
                </li>
            </ul>
        </nav>
        <div class="sidebar__footer">
            <div class="sidebar__version">Zip Jeweler v1.0</div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main" id="main-content">
        <!-- Content injected by router -->
    </main>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal__header">
                <h2 class="modal__title" id="modal-title"></h2>
                <button class="modal__close" id="modal-close" aria-label="Close modal">&times;</button>
            </div>
            <div class="modal__body" id="modal-body"></div>
            <div class="modal__footer" id="modal-footer"></div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- File Input (hidden) for XML Import -->
    <input type="file" id="xml-file-input" accept=".xml" style="display:none">

    <!-- Scripts: Core first, then modules, then plugins -->
    <script src="js/core/utils.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/events.js"></script>
    <script src="js/core/modal.js"></script>
    <script src="js/core/xml-engine.js"></script>
    <script src="js/core/plugin-system.js"></script>
    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/inventory.js"></script>
    <script src="js/modules/orders.js"></script>
    <script src="js/modules/customers.js"></script>
    <script src="js/modules/appraisals.js"></script>
    <script src="js/modules/repairs.js"></script>
    <script src="js/modules/custom-orders.js"></script>
    <script src="js/modules/reports.js"></script>
    <script src="js/modules/tools.js"></script>
    <script src="js/modules/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
